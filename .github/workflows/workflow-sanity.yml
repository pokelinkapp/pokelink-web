name: Workflow sanity

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [v3, master]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: workflow-sanity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            | bash -s -- "$ACTIONLINT_VERSION"
          ./actionlint -color
      - name: zizmor
        env:
          # Lets zizmor check action references against GitHub.
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.1 --min-severity medium --min-confidence medium .github/workflows
